name: MinisTermux Monolithic Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

env:
  PACKAGE_NAME: com.ministermux
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

jobs:
  # 1. Build Termux Packages (Custom Repo)
  build-packages:
    name: Build Packages & Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/termux/package-builder:latest
      options: --user root
    steps:
      - name: Checkout termux-packages fork
        uses: actions/checkout@v4
        with:
          repository: ministermux/termux-packages
          path: termux-packages
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set package name
        run: |
          cd termux-packages
          sed -i 's/TERMUX_APP__PACKAGE_NAME=.*/TERMUX_APP__PACKAGE_NAME=com.ministermux/' properties.sh
          sed -i 's|TERMUX__PREFIX=.*|TERMUX__PREFIX=/data/data/com.ministermux/files/usr|' properties.sh
      
      - name: Build all packages
        run: |
          cd termux-packages
          ./scripts/run-docker.sh ./build-all.sh
      
      - name: Build bootstrap (universal)
        run: |
          cd termux-packages
          ./scripts/run-docker.sh ./build-bootstrap.sh com.ministermux universal
      
      - name: Build bootstrap (arch-specific)
        run: |
          cd termux-packages
          for arch in aarch64 arm x86_64 x86; do
            ./scripts/run-docker.sh ./build-bootstrap.sh com.ministermux $arch
          done
      
      - name: Sign repository
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          cd termux-packages
          echo "$GPG_PRIVATE_KEY" | gpg --import
          ./scripts/run-docker.sh ./sign-repo.sh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      
      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: |
            termux-packages/output/ministermux-bootstrap-*.zip
            termux-packages/output/repo/
          retention-days: 7

  # 2. Build Monolithic APK
  build-apk:
    name: Build Monolithic APK
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          path: ministermux
      
      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v4
        with:
          name: bootstrap
          path: ministermux/core/src/main/assets/bootstrap
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: 'latest'
      
      - name: Setup keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > ministermux.keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      
      - name: Setup local.properties
        run: |
          cat > ministermux/local.properties << 'EOF'
          sdk.dir=${ANDROID_HOME}
          ndk.dir=${ANDROID_NDK_HOME}
          SIGNING_KEYSTORE=ministermux.keystore
          SIGNING_KEY_ALIAS=ministermux
          SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}
          EOF
        working-directory: ministermux
      
      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ministermux
      
      - name: Build all flavors (universal + arch-specific)
        run: |
          ./gradlew assembleRelease --no-daemon -PversionName=${{ github.event.inputs.version || github.ref_name }}
        working-directory: ministermux
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      
      - name: Verify APKs
        run: |
          ls -la core/build/outputs/apk/release/
          for apk in core/build/outputs/apk/release/*.apk; do
            echo "=== $apk ==="
            aapt dump badging "$apk" | head -20
          done
        working-directory: ministermux
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ministermux-apks
          path: ministermux/core/build/outputs/apk/release/*.apk
          retention-days: 30

  # 3. Create GitHub Release
  release:
    name: Create Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: ministermux-apks
          path: release-apks
      
      - name: Generate release notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          # MinisTermux ${{ github.ref_name }}
          
          **Monolithic single-APK build** containing:
          - Terminal emulator (bash, zsh, fish)
          - Termux:API (Android API bridge + MinisAgentApi)
          - Termux:Boot (auto-start scripts)
          - Termux:X11 (X11 server for GUI)
          - Termux:Tasker (Tasker integration)
          - Termux:Widget (home screen shortcuts)
          - Termux:Float (overlay terminal)
          - Termux:Styling (themes/fonts)
          
          **Pre-installed**: 72 MCP servers, 40+ skills, AI/ML tools (llama.cpp, whisper.cpp), development toolchain
          
          ## Downloads
          - `ministermux-universal-release.apk` - All architectures (~180 MB)
          - `ministermux-aarch64-release.apk` - ARM64 only (~120 MB)
          - `ministermux-arm-release.apk` - ARM32 only
          - `ministermux-x86_64-release.apk` - x86_64 only
          - `ministermux-x86-release.apk` - x86 only
          
          ## Installation
          1. Download the APK for your architecture
          2. Install (allow unknown sources if needed)
          3. Open app - bootstrap extracts automatically
          4. Grant all requested permissions
          5. Connect from OpenMinis app
          
          ## Minis Integration
          - WebSocket bridge: `ws://localhost:8765`
          - Intent API: `com.ministermux.RUN_COMMAND`
          - ContentProvider: `com.ministermux.minisagent`
          - File bridge: `/data/data/com.ministermux/files/home/` ↔ Minis workspace
          EOF
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-apks/*.apk
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Deploy APT Repo (GitHub Pages)
  deploy-apt-repo:
    name: Deploy APT Repository
    needs: build-packages
    runs-on: ubuntu-latest
    if: env.GPG_PRIVATE_KEY != ''
    steps:
      - name: Download repo artifacts
        uses: actions/download-artifact@v4
        with:
          name: bootstrap
          path: repo-output
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo-output/repo
          destination_dir: apt
          commit_message: "Deploy APT repo ${{ github.sha }}"
          publish_branch: gh-pages

  # 5. Security Scan
  security-scan:
    name: Security Scan
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ministermux-apks
          path: apks
      
      - name: Run MobSF Scan
        uses: docker://opensecurity/mobile-security-framework-mobsf:latest
        with:
          args: >
            bash -c "
            pip install mobsfscan &&
            mobsfscan -f apks/*.apk -o sarif
            "
        continue-on-error: true
      
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: mobsf

  # 6. Test on Emulator
  test-emulator:
    name: Test on Android Emulator
    needs: build-apk
    runs-on: macos-latest  # macOS for better emulator perf
    timeout-minutes: 30
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ministermux-apks
          path: apks
      
      - name: Setup Android Emulator
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          arch: x86_64
          ndk-version: r26c
      
      - name: Start Emulator
        run: |
          emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect &
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
      
      - name: Install APK
        run: |
          adb install -r apks/ministermux-x86_64-release.apk
      
      - name: Test Bridge Service
        run: |
          adb shell am start -n com.ministermux/.bridge.MinisBridgeService
          sleep 5
          adb shell am broadcast -a com.ministermux.RUN_COMMAND \
            --es command "echo" \
            --es args '["Hello from CI"]'
          sleep 3
          adb logcat -d | grep -i ministermux | head -20
      
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: /tmp/emulator-logs